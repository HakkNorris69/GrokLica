<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrokLica</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: system-ui, sans-serif; background: #0d0d0d; color: #e8e8e8; height: 100vh; display: flex; flex-direction: column; }
header { padding: 14px 16px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
#chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 85%; padding: 10px 14px; border-radius: 12px; line-height: 1.4; white-space: pre-wrap; }
.user { align-self: flex-end; background: #1a1a1a; border: 1px solid #333; }
.bot { align-self: flex-start; background: #141414; border: 1px solid #2a2a2a; }
.empty { margin: auto; color: #777; text-align: center; }
footer { padding: 12px; border-top: 1px solid #222; display: flex; gap: 8px; }
input { flex: 1; background: #1a1a1a; border: 1px solid #333; color: #fff; padding: 12px 14px; border-radius: 24px; outline: none; }
button { background: #fff; color: #000; border: none; padding: 12px 16px; border-radius: 24px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <strong>GrokLica</strong>
  <span style="font-size:12px;color:#888">Demo</span>
</header>
<div id="chat"><p class="empty">No Node needed. Type a message.</p></div>
<footer>
  <input id="input" type="text" placeholder="Message GrokLica..." autocomplete="off">
  <button onclick="send()">Send</button>
</footer>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
function add(text, user) {
  const empty = chat.querySelector('.empty');
  if (empty) empty.remove();
  const d = document.createElement('div');
  d.className = 'msg ' + (user ? 'user' : 'bot');
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}
function reply(q) {
  const s = q.toLowerCase();
  if (s.includes('who') && s.includes('you')) return "I'm GrokLica, a Super Grok replica UI running as a single HTML file.";
  if (s.includes('hi') || s.includes('hello')) return 'Hey. What do you want to build?';
  return 'Got it: "' + q + '"\n\nLocal demo reply. No server installed.';
}
function send() {
  const t = input.value.trim();
  if (!t) return;
  add(t, true);
  input.value = '';
  setTimeout(() => add(reply(t), false), 400);
}
input.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
</script>
</body>
</html>
